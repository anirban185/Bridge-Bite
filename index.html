<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bridge Bite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cabinet">
    <div class="screen">
      <canvas id="game" width="320" height="240" aria-label="Bridge Bite fishing game"></canvas>
    </div>

    <div class="pad" aria-label="Touch controls">
      <button type="button" data-key="left" aria-label="Move left">LEFT</button>
      <button type="button" data-key="cast" class="cast" aria-label="Cast or reel">CAST</button>
      <button type="button" data-key="right" aria-label="Move right">RIGHT</button>
    </div>

    <p class="help">Arrows or A/D move the rod. Space casts and reels. M mutes. P pauses.</p>
  </main>

  <script src="game.js"></script>
</body>
</html>
